[tools]
go = "1.26.5"
golangci-lint = "2.9.0"
"go:golang.org/x/tools/cmd/goimports" = "v0.48.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"

[tasks.format]
description = "Format Go source"
run = "goimports -w ."

[tasks.test]
description = "Run all tests"
run = "go test -race ./..."

[tasks.lint]
description = "Run static checks"
depends = ["format-check"]
run = ["go vet ./...", "golangci-lint run", "govulncheck ./..."]

[tasks.format-check]
description = "Require goimports-clean source"
run = "test -z \"$(goimports -l .)\""
