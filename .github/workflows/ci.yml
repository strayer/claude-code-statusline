name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install analysis tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Check formatting
        run: test -z "$(goimports -l .)"
      - name: Run tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  go-version-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Go versions match
        run: |
          gomod=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)
          mise=$(sed -n 's/^go = "\([0-9][0-9.]*\)"$/\1/p' mise.toml)
          echo "go.mod:    ${gomod:-<not found>}"
          echo "mise.toml: ${mise:-<not found>}"
          if [ -z "$gomod" ] || [ -z "$mise" ]; then
            echo "::error::Failed to extract a Go version from one or more files"
            exit 1
          fi
          if [ "$gomod" != "$mise" ]; then
            echo "::error::Go versions are out of sync: go.mod has $gomod, mise.toml has $mise"
            exit 1
          fi

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile release targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 linux/arm64 linux/amd64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags="-s -w -buildid=" -o /dev/null .
          done
